<template>
  <lightning-card title={labels.title} icon-name="custom:custom98">
    <lightning-button-icon
      slot="actions"
      class="elogix-refresh"
      icon-name="utility:refresh"
      alternative-text={labels.refresh}
      title={labels.refresh}
      onclick={handleRefresh}
    ></lightning-button-icon>
    <div class="slds-p-horizontal_medium">
      <lightning-tabset>
        <lightning-tab label={vehicleTabLabel} value="vehicles">
          <c-reusable-data-table
            class="elogix-vehicles"
            columns={vehicleColumns}
            records={vehicles}
            is-loading={isLoading}
            error={error}
            empty-message={labels.noVehicles}
            table-label={labels.vehicles}
            hide-checkbox-column
            onrowaction={handleVehicleAction}
            onretry={handleRefresh}
          ></c-reusable-data-table>
        </lightning-tab>
        <lightning-tab label={driverTabLabel} value="drivers">
          <c-reusable-data-table
            class="elogix-drivers"
            columns={driverColumns}
            records={drivers}
            is-loading={isLoading}
            error={error}
            empty-message={labels.noDrivers}
            table-label={labels.drivers}
            hide-checkbox-column
            onrowaction={handleDriverAction}
            onretry={handleRefresh}
          ></c-reusable-data-table>
        </lightning-tab>
      </lightning-tabset>
    </div>
  </lightning-card>
</template>
