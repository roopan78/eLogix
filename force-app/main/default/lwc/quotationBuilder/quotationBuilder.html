<template>
  <lightning-card title={labels.title} icon-name="standard:quotes">
    <template lwc:if={isRequestPage}>
      <div class="slds-p-horizontal_medium">
        <lightning-button
          class="elogix-create"
          variant="brand"
          label={labels.create}
          disabled={isWorking}
          onclick={handleCreate}
        ></lightning-button>
      </div>
    </template>
    <template lwc:else>
      <div slot="actions">
        <c-status-badge status={status}></c-status-badge>
      </div>
      <div class="slds-p-horizontal_medium">
        <lightning-record-view-form
          record-id={recordId}
          object-api-name="Quotation__c"
        >
          <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <lightning-output-field
                field-name="Shipment_Request__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Rate_Card__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Valid_Until__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Base_Freight__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Weight_Charge__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Distance_Charge__c"
              ></lightning-output-field>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <lightning-output-field
                field-name="Fuel_Surcharge__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Insurance_Charge__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Discount__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Subtotal__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Tax_Amount__c"
              ></lightning-output-field>
              <lightning-output-field
                field-name="Total_Amount__c"
              ></lightning-output-field>
            </div>
          </div>
        </lightning-record-view-form>
      </div>

      <div class="slds-p-around_medium">
        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
          {labels.lines}
        </h3>
        <c-reusable-data-table
          columns={lineColumns}
          records={lines}
          is-loading={isLoadingLines}
          error={linesError}
          empty-message={labels.noLines}
          table-label={labels.lines}
          hide-checkbox-column
        ></c-reusable-data-table>
      </div>

      <div class="slds-p-around_medium slds-border_top">
        <template lwc:if={isWorking}>
          <c-loading-indicator size="small"></c-loading-indicator>
        </template>
        <template lwc:if={hasActions}>
          <lightning-button-group>
            <template for:each={actions} for:item="action">
              <lightning-button
                key={action.name}
                class="elogix-action"
                data-name={action.name}
                label={action.label}
                variant={action.variant}
                disabled={isWorking}
                onclick={handleAction}
              ></lightning-button>
            </template>
          </lightning-button-group>
        </template>
        <template lwc:else>
          <p class="slds-text-color_weak elogix-no-actions">
            {labels.noActions}
          </p>
        </template>
      </div>
    </template>
  </lightning-card>
</template>
