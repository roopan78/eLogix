<template>
  <lightning-card title={labels.title} icon-name="standard:timeline">
    <lightning-button-icon
      slot="actions"
      class="elogix-refresh"
      icon-name="utility:refresh"
      alternative-text={labels.refresh}
      title={labels.refresh}
      onclick={handleRefresh}
    ></lightning-button-icon>
    <div class="slds-p-horizontal_medium">
      <template lwc:if={isLoading}>
        <c-loading-indicator size="small"></c-loading-indicator>
      </template>
      <template lwc:elseif={error}>
        <div class="slds-text-color_error elogix-error" role="alert">
          {error}
        </div>
      </template>
      <template lwc:elseif={isEmpty}>
        <p class="slds-text-color_weak elogix-empty">{labels.empty}</p>
      </template>
      <template lwc:elseif={hasEvents}>
        <ul class="slds-timeline">
          <template for:each={events} for:item="event">
            <li key={event.Id} class="elogix-event">
              <div
                class="slds-timeline__item_expandable slds-timeline__item_task"
              >
                <div class="slds-media">
                  <div class="slds-media__figure">
                    <lightning-icon
                      icon-name="standard:event"
                      size="small"
                      alternative-text={event.Event_Type__c}
                    ></lightning-icon>
                  </div>
                  <div class="slds-media__body">
                    <div class="slds-grid slds-grid_align-spread">
                      <h4 class="slds-text-heading_small elogix-event-type">
                        {event.Event_Type__c}
                      </h4>
                      <p class="slds-timeline__date">
                        <lightning-formatted-date-time
                          value={event.Event_Timestamp__c}
                          year="numeric"
                          month="short"
                          day="2-digit"
                          hour="2-digit"
                          minute="2-digit"
                        ></lightning-formatted-date-time>
                      </p>
                    </div>
                    <template lwc:if={event.isStatusEvent}>
                      <p class="slds-m-top_xx-small elogix-transition">
                        <template lwc:if={event.From_Status__c}>
                          <c-status-badge
                            status={event.From_Status__c}
                          ></c-status-badge>
                          <span
                            class="slds-p-horizontal_xx-small"
                            aria-hidden="true"
                            >→</span
                          >
                        </template>
                        <c-status-badge
                          status={event.To_Status__c}
                        ></c-status-badge>
                      </p>
                    </template>
                    <template lwc:if={event.Location__c}>
                      <p class="slds-m-top_xx-small elogix-location">
                        {event.Location__c}
                      </p>
                    </template>
                    <template lwc:if={event.Remarks__c}>
                      <p class="slds-text-color_weak slds-m-top_xx-small">
                        {event.Remarks__c}
                      </p>
                    </template>
                    <p class="slds-text-body_small slds-text-color_weak">
                      {event.Source__c}
                    </p>
                  </div>
                </div>
              </div>
            </li>
          </template>
        </ul>
      </template>
    </div>
  </lightning-card>
</template>
